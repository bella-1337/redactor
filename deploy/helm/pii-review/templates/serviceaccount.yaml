{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "pii-review.serviceAccountName" . }}
  labels:
    {{- include "pii-review.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# No pod talks to the Kubernetes API.
automountServiceAccountToken: false
{{- end }}
