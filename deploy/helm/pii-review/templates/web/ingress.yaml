{{- $ingress := .Values.web.ingress }}
{{- if $ingress.enabled }}
{{- if not $ingress.hosts }}
{{- fail "web.ingress.hosts must list at least one host name" }}
{{- end }}
{{- $component := dict "root" $ "component" "web" }}
{{- $name := include "pii-review.componentName" $component }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $name }}
  labels:
    {{- include "pii-review.componentLabels" $component | nindent 4 }}
  {{- with $ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with $ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with $ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range $ingress.hosts }}
    - host: {{ . | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $name }}
                port:
                  name: http
    {{- end }}
{{- end }}
