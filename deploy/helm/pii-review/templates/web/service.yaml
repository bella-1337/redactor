{{- $component := dict "root" $ "component" "web" }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "pii-review.componentName" $component }}
  labels:
    {{- include "pii-review.componentLabels" $component | nindent 4 }}
spec:
  type: {{ .Values.web.service.type }}
  selector:
    {{- include "pii-review.componentSelectorLabels" $component | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.web.service.port }}
      targetPort: http
      protocol: TCP
