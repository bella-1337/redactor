{{- if .Values.web.assist.key }}
{{- $component := dict "root" $ "component" "web" }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "pii-review.componentName" $component }}
  labels:
    {{- include "pii-review.componentLabels" $component | nindent 4 }}
type: Opaque
data:
  {{ .Values.web.assist.existingSecretKey }}: {{ .Values.web.assist.key | b64enc | quote }}
{{- end }}
