[package]
name = "pii-review-desktop"
version = "0.4.0"
description = "PII Review desktop app: check and mask personal data in texts and documents, offline"
license = "MIT"
edition = "2021"
rust-version = "1.80"
publish = false

[[bin]]
name = "pii-review"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
tauri = { version = "2.12.7", features = [] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
