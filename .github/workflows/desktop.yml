# Builds the PII Review desktop installers on each platform's own runner:
#   macOS:   .dmg (Apple silicon; macOS 15 or later)
#   Windows: .exe (NSIS, per user) and .msi, with the WebView2 offline installer
#   Linux:   .deb, .rpm, and .AppImage (x86_64 and arm64; glibc 2.39 or later)
# Every installer carries the Python runtime, Presidio and its spaCy models,
# Xberg, and the Tesseract data (desktop/scripts/build_runtime.py).
#
# Runs on pull requests that touch the app, on demand, and on v* tags, which
# also attach the installers to a draft GitHub release.
#
# The installers are not code-signed: see desktop/README.md#signing.

name: desktop

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "app/**"
      - "desktop/**"
      - "images/presidio-analyzer/**"
      - "images/xberg/**"
      - ".github/workflows/desktop.yml"

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.12.15"
  NODE_VERSION: "22"

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: ${{ env.UV_VERSION }}
      - name: Unit tests
        run: uv run --no-project --python 3.12 python -m unittest discover -s tests

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          # The runner images match the bundled Xberg binaries' minimums:
          # macOS 15 for its arm64 libraries, glibc 2.39 (Ubuntu 24.04) on
          # Linux. No Intel Mac build: cryptography (Presidio's anonymizer)
          # has published no macOS x86_64 wheels since 49.0.
          - name: macos-arm64
            runner: macos-15
            bundles: app,dmg
          - name: windows-x64
            runner: windows-2022
            bundles: nsis,msi
          - name: linux-x64
            runner: ubuntu-24.04
            bundles: deb,rpm,appimage
          - name: linux-arm64
            runner: ubuntu-24.04-arm
            bundles: deb,rpm,appimage
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Free disk space (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev patchelf rpm file

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: ${{ env.UV_VERSION }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Cache downloads (Python packages, Xberg, Tesseract data)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: desktop/build/cache
          key: runtime-${{ matrix.name }}-${{ hashFiles('desktop/runtime/*') }}

      - name: Stage the bundled runtime
        run: uv run --no-project --python 3.12 desktop/scripts/build_runtime.py

      - name: Install the Tauri CLI
        working-directory: desktop
        run: npm ci --no-fund --no-audit

      - name: Build the installers
        working-directory: desktop
        shell: bash
        run: npx tauri build --bundles "${{ matrix.bundles }}"

      - name: Collect the installers
        shell: bash
        run: |
          mkdir -p dist
          bundle=desktop/src-tauri/target/release/bundle
          find "$bundle" -maxdepth 2 -type f \
            \( -name '*.dmg' -o -name '*.exe' -o -name '*.msi' -o -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \) \
            -exec cp {} dist/ \;
          ls -la dist
          test -n "$(ls dist)"
          cd dist && for file in *; do shasum -a 256 "$file" > "$file.sha256"; done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pii-review-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          draft: true
          files: dist/*
