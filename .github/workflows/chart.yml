# Checks the Helm chart in deploy/helm/pii-review: lint, render with every
# values file in its ci/ folder, validate the manifests against the
# Kubernetes schemas, and run the chart tests (tests/test_helm_chart.py).
#
# Helm and kubeconform are official release binaries, checked against pinned
# SHA-256 sums.

name: chart

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "deploy/helm/**"
      - "images/**"
      - "tests/test_helm_chart.py"
      - "tests/requirements-chart.txt"
      - ".github/workflows/chart.yml"
  push:
    branches: [main]
    paths:
      - "deploy/helm/**"
      - ".github/workflows/chart.yml"

permissions:
  contents: read

concurrency:
  group: chart-${{ github.ref }}
  cancel-in-progress: true

env:
  CHART: deploy/helm/pii-review
  HELM_VERSION: "v4.3.1"
  HELM_SHA256: "0403a88ae20913d11b10a2467b50087721fea7581736da6b9d3992f5357fe54b"
  KUBECONFORM_VERSION: "v0.8.0"
  KUBECONFORM_SHA256: "9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883"
  # The oldest Kubernetes the chart supports (Chart.yaml kubeVersion) and a
  # current one.
  KUBERNETES_VERSIONS: "1.27.0 1.34.0"
  UV_VERSION: "0.12.15"

jobs:
  chart:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Helm and kubeconform
        run: |
          mkdir -p "$RUNNER_TEMP/bin" && cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location --output helm.tgz \
            "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz"
          echo "${HELM_SHA256}  helm.tgz" | sha256sum --check --strict
          tar -xzf helm.tgz --strip-components=1 -C bin linux-amd64/helm
          curl --fail --silent --show-error --location --output kubeconform.tgz \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  kubeconform.tgz" | sha256sum --check --strict
          tar -xzf kubeconform.tgz -C bin kubeconform
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Lint
        run: |
          for values in "$CHART"/ci/*-values.yaml; do
            helm lint --strict "$CHART" --values "$values"
          done

      - name: Render and validate
        run: |
          mkdir -p "$RUNNER_TEMP/rendered"
          for values in "$CHART"/ci/*-values.yaml; do
            out="$RUNNER_TEMP/rendered/$(basename "$values" -values.yaml).yaml"
            helm template pii-review "$CHART" --namespace pii-review --values "$values" > "$out"
          done
          for version in $KUBERNETES_VERSIONS; do
            kubeconform -strict -summary -kubernetes-version "$version" \
              -schema-location default \
              -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
              "$RUNNER_TEMP"/rendered/*.yaml
          done

      - name: Package
        run: helm package "$CHART" --destination "$RUNNER_TEMP/package"

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: ${{ env.UV_VERSION }}

      - name: Chart tests
        run: |
          uv run --no-project --python 3.12 --with-requirements tests/requirements-chart.txt \
            python -m unittest -v tests/test_helm_chart.py
