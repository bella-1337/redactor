# PII review tool: a page where users check the personal data in a text or
# document, choose what to mask, and copy the masked result.
#
#   cp .env.example .env    # set PII_REVIEW_GATEWAYS at least
#   docker compose up -d --build
#
# The page is published on 127.0.0.1 only; put a TLS reverse proxy in front of
# it to offer it to others. Nothing is stored, and the services log no content.

name: ${COMPOSE_PROJECT_NAME:-pii-review}

x-logging: &logging
  driver: json-file
  options:
    max-size: "${LOG_MAX_SIZE:-10m}"
    max-file: "${LOG_MAX_FILE:-3}"

services:
  pii-review:
    logging: *logging
    image: pii-review:0.4.0
    build:
      # The package in app/ is shared with the desktop app, so the context is
      # the repository root; images/pii-review/Dockerfile.dockerignore trims it.
      context: .
      dockerfile: images/pii-review/Dockerfile
      labels:
        org.opencontainers.image.title: pii-review
        org.opencontainers.image.description: Page that shows the personal data Presidio and a local model find and masks what the user selects
        org.opencontainers.image.version: "0.4.0"
        org.opencontainers.image.base.name: ghcr.io/astral-sh/uv:0.9.30-python3.13-bookworm-slim
    user: "65532:65532"
    environment:
      PII_REVIEW_GATEWAYS: ${PII_REVIEW_GATEWAYS:?Set PII_REVIEW_GATEWAYS in .env}
      PII_REVIEW_ANALYZER_URL: http://presidio-analyzer:3000
      PII_REVIEW_ANONYMIZER_URL: http://presidio-anonymizer:3000
      PII_REVIEW_XBERG_URL: http://xberg:8000
      PII_REVIEW_XBERG_TIMEOUT_SECONDS: "${PII_REVIEW_XBERG_TIMEOUT_SECONDS:-1800}"
      PII_REVIEW_LANGUAGE: ${PII_REVIEW_LANGUAGE:-en}
      PII_REVIEW_MAX_TEXT_BYTES: "${PII_REVIEW_MAX_TEXT_BYTES:-250000000}"
      PII_REVIEW_MAX_FILE_BYTES: "${PII_REVIEW_MAX_FILE_BYTES:-209715200}"
      PII_REVIEW_REQUESTS_PER_MINUTE: "${PII_REVIEW_REQUESTS_PER_MINUTE:-30}"
      # Analyzer requests in flight per analysis; keep equal to its workers.
      PII_REVIEW_ANALYZE_PARALLEL: "${PII_REVIEW_ANALYZE_PARALLEL:-${PRESIDIO_ANALYZER_WORKERS:-2}}"
      PII_REVIEW_ASSIST_URL: ${PII_REVIEW_ASSIST_URL:-}
      PII_REVIEW_ASSIST_MODEL: ${PII_REVIEW_ASSIST_MODEL:-pii-assist}
      PII_REVIEW_ASSIST_KEY: ${PII_REVIEW_ASSIST_KEY:-}
      PII_REVIEW_ASSIST_MAX_CALLS: "${PII_REVIEW_ASSIST_MAX_CALLS:-8}"
    ports:
      - "${PII_REVIEW_BIND:-127.0.0.1}:${PII_REVIEW_PORT:-8080}:8080"
    # Reaches a gateway or Ollama on the Docker host (built in on Docker
    # Desktop, needed on Linux).
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      # One analyzer runs, the one of the profile in COMPOSE_PROFILES; both
      # answer as presidio-analyzer on the backend network.
      presidio-analyzer:
        condition: service_healthy
        required: false
      presidio-analyzer-transformers:
        condition: service_healthy
        required: false
      presidio-anonymizer:
        condition: service_healthy
      xberg:
        condition: service_healthy
    # frontend: published port, gateways, and the model API.
    # backend: Presidio. extract: Xberg only.
    networks: [frontend, backend, extract]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "${PII_REVIEW_CPU_LIMIT:-2}"
          # A 200 MiB upload plus its extracted text and detections.
          memory: ${PII_REVIEW_MEMORY_LIMIT:-3g}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=5)"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 10s

  # Presidio's NLP engine is chosen with a profile, COMPOSE_PROFILES in .env:
  #   spacy         spaCy pipelines (default)
  #   transformers  a multilingual Hugging Face NER model (PyTorch, CPU)
  # Choose one: both analyzers answer as presidio-analyzer.
  presidio-analyzer:
    profiles: [spacy]
    logging: *logging
    image: pii-review-presidio-analyzer:2.2.362-2
    build:
      context: ./images/presidio-analyzer
      args:
        NLP_ENGINE: spacy
      labels:
        org.opencontainers.image.title: pii-review-presidio-analyzer
        org.opencontainers.image.description: Presidio analyzer with English, German, and French spaCy pipelines
        org.opencontainers.image.version: 2.2.362-2
        org.opencontainers.image.base.name: mcr.microsoft.com/presidio-analyzer:2.2.362
        org.opencontainers.image.licenses: MIT AND LGPL-LR
    # Its configuration (images/presidio-analyzer/conf) is built into the image.
    environment:
      WORKERS: ${PRESIDIO_ANALYZER_WORKERS:-2}
      # Load the pipelines once before forking so workers share them (about
      # 2.5 GiB in all instead of 2.4 GiB per worker). No control socket: the
      # file system is read-only.
      GUNICORN_CMD_ARGS: --no-control-socket --preload
    networks: [backend]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "${PRESIDIO_ANALYZER_CPU_LIMIT:-2}"
          memory: ${PRESIDIO_ANALYZER_MEMORY_LIMIT:-4g}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s

  presidio-analyzer-transformers:
    profiles: [transformers]
    logging: *logging
    image: pii-review-presidio-analyzer:2.2.362-2-transformers
    build:
      context: ./images/presidio-analyzer
      args:
        NLP_ENGINE: transformers
        # The NER model and its commit (images/presidio-analyzer/Dockerfile).
        HF_MODEL: ${PRESIDIO_HF_MODEL:-Davlan/xlm-roberta-base-ner-hrl}
        HF_MODEL_REVISION: ${PRESIDIO_HF_MODEL_REVISION:-main}
      labels:
        org.opencontainers.image.title: pii-review-presidio-analyzer
        org.opencontainers.image.description: Presidio analyzer with the Transformers NLP engine and a multilingual Hugging Face NER model
        org.opencontainers.image.version: 2.2.362-2-transformers
        org.opencontainers.image.base.name: mcr.microsoft.com/presidio-analyzer:2.2.362
    environment:
      WORKERS: ${PRESIDIO_ANALYZER_WORKERS:-2}
      GUNICORN_CMD_ARGS: --no-control-socket --preload
      # One PyTorch thread per worker: the workers already use the CPUs.
      OMP_NUM_THREADS: "1"
    networks:
      backend:
        aliases: [presidio-analyzer]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "${PRESIDIO_ANALYZER_CPU_LIMIT:-2}"
          # The model is loaded once per language (about 1.1 GiB each for the
          # default), plus PyTorch.
          memory: ${PRESIDIO_TRANSFORMERS_MEMORY_LIMIT:-6g}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s

  presidio-anonymizer:
    logging: *logging
    image: mcr.microsoft.com/presidio-anonymizer:2.2.362@sha256:a10a12a2a613d13cf29d3ad3641e3258444dd8c90403dd644a0a114c472c2483
    environment:
      WORKERS: ${PRESIDIO_ANONYMIZER_WORKERS:-2}
      GUNICORN_CMD_ARGS: --no-control-socket
    networks: [backend]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1g
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  # Document extraction with Xberg's upload API. It sits alone with the page on
  # the internal `extract` network: no internet, so it cannot fetch anything a
  # document links to, and local-file inputs are off (images/xberg/xberg.toml,
  # built into the image).
  xberg:
    logging: *logging
    image: pii-review-xberg:1.3.10-1
    build:
      context: ./images/xberg
      labels:
        org.opencontainers.image.title: pii-review-xberg
        org.opencontainers.image.description: Xberg document extraction with the PII review tool's configuration
        org.opencontainers.image.version: 1.3.10-1
        org.opencontainers.image.base.name: ghcr.io/xberg-io/xberg:1.3.10-core
    environment:
      RUST_LOG: ${XBERG_LOG_LEVEL:-warn}
      XBERG_CACHE_DIR: /tmp/xberg-cache
      HF_HOME: /tmp/huggingface
      # 250 MiB: a 200 MiB upload plus multipart framing.
      XBERG_MAX_REQUEST_BODY_BYTES: "262144000"
      XBERG_MAX_MULTIPART_FIELD_BYTES: "262144000"
      # Only the page calls the API, from inside the extract network; no
      # browser origin needs it.
      XBERG_CORS_ORIGINS: http://pii-review.invalid
    networks: [extract]
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=${XBERG_TMP_SIZE:-1g}
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "${XBERG_CPU_LIMIT:-2}"
          memory: ${XBERG_MEMORY_LIMIT:-4g}
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--output", "/dev/null", "http://127.0.0.1:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 15s

networks:
  frontend: {}
  backend:
    internal: true
  extract:
    internal: true
